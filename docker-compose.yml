# version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: kbuy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: kbuy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kbuy_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./koreabuy-backend
    container_name: kbuy_backend
    restart: always
    command: sh -c "npm run migrate && npm run seed && node dist/index.js"
    env_file:
      - ./koreabuy-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  email-worker:
    build: ./koreabuy-backend
    container_name: kbuy_worker
    restart: always
    command: node dist/worker.js
    env_file:
      - ./koreabuy-backend/.env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./koreabuy-frontend
    container_name: kbuy_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: kbuy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend


volumes:
  postgres_data: